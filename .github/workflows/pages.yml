# Baut die Website und die Container-Kacheln und veröffentlicht beides auf GitHub Pages.
# Läuft bei jeder Änderung an der Website, jeden Montag früh (frische OSM-Daten) und auf Knopfdruck.
# Die Kacheln werden je Kalenderwoche zwischengespeichert: Reine Website-Änderungen laden den
# 4,9-GB-Auszug von Geofabrik nicht erneut. Der Montagslauf und „Run workflow“ bauen immer frisch.
name: Website und Containerdaten

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kalenderwoche bestimmen
        id: week
        run: echo "w=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Kacheln aus dem Zwischenspeicher
        id: cache
        uses: actions/cache@v4
        with:
          path: data-cache
          key: tiles-${{ steps.week.outputs.w }}-${{ hashFiles('tools/build_tiles.py', '.github/workflows/pages.yml') }}

      - name: Kacheln neu bauen?
        id: rebuild
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" != "true" ] || [ "${{ github.event_name }}" != "push" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: osmium installieren
        if: steps.rebuild.outputs.yes == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool

      - name: Deutschland-Auszug von Geofabrik laden
        if: steps.rebuild.outputs.yes == 'true'
        run: |
          UA="containerkarte-data-build (+https://github.com/curlyrob/containerkarte)"
          curl -fsSL -A "$UA" -o germany.osm.pbf https://download.geofabrik.de/europe/germany-latest.osm.pbf
          curl -fsSL -A "$UA" -o germany.poly https://download.geofabrik.de/europe/germany.poly
          ls -lh germany.osm.pbf

      - name: Wertstoffcontainer herausfiltern und Kacheln bauen
        if: steps.rebuild.outputs.yes == 'true'
        run: |
          osmium tags-filter germany.osm.pbf nwr/amenity=recycling,waste_transfer_station -o recycling.osm.pbf
          osmium export recycling.osm.pbf -f geojsonseq -a type,id \
            --geometry-types=point,linestring,polygon -o recycling.geojsonseq
          rm -rf data-cache && mkdir -p data-cache
          python3 tools/build_tiles.py recycling.geojsonseq germany.poly data-cache/v1

      - name: Website und Kacheln zusammenstellen
        run: |
          mkdir -p _site/data
          cp *.html style.css icon.png _site/
          cp -R data-cache/v1 _site/data/v1
          du -sh _site/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
